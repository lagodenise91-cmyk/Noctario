<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noctario - Archivo de Sueños</title>

<style>
/* --- BASE --- */
body {
    background-color: white;
    color: black;
    font-family: 'Courier New', Courier, monospace;
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
}

/* --- PANTALLA DE INICIO --- */
#inicio {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 1000;
    cursor: pointer;
    transition: opacity 1s ease;
}

#inicio strong {
    font-weight: bold;
    font-size: 1.4em;
    letter-spacing: 5px;
}

#click-entrar {
    font-size: 12px;
    letter-spacing: 2px;
    color: #999;
    margin-top: 30px;
    text-transform: uppercase;
}

/* --- INTERFAZ --- */
#top-nav {
    position: absolute;
    top: 30px;
    right: 30px;
    font-size: 28px;
    cursor: pointer;
    user-select: none;
    z-index: 100;
    line-height: 1;
}

#escritura {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100vw;
}

textarea {
    width: 80%;
    max-width: 500px;
    height: 120px;
    border: 1px solid black;
    padding: 20px;
    font-family: 'Courier New';
    font-size: 16px;
    outline: none;
    resize: none;
    background: white;
    line-height: 1.5;
}

button {
    background: white;
    border: 1px solid black;
    padding: 8px 25px;
    margin-top: 20px;
    font-family: 'Courier New';
    cursor: pointer;
    font-size: 14px;
    text-transform: lowercase;
    transition: 0.3s;
}

button:hover {
    background: black;
    color: white;
}

#biblioteca {
    display: none;
    padding: 100px 20px;
    overflow-y: auto;
    height: 100%;
    box-sizing: border-box;
}

#centro-biblioteca {
    max-width: 600px;
    margin: 0 auto;
}

#buscador {
    width: 100%;
    border: none;
    border-bottom: 1px solid black;
    font-family: 'Times New Roman', serif;
    font-size: 24px;
    outline: none;
    margin-bottom: 50px;
    background: transparent;
    padding-bottom: 5px;
}

.sueño {
    font-family: 'Times New Roman', serif;
    font-size: 19px;
    line-height: 1.6;
    margin-bottom: 40px;
    border-bottom: 1px dotted #ccc;
    padding-bottom: 20px;
    white-space: pre-wrap;
    display: none; /* Se activan con la búsqueda */
}

#contador {
    position: fixed;
    bottom: 15px;
    left: 15px;
    font-size: 10px;
    color: #999;
    letter-spacing: 2px;
    text-transform: uppercase;
}

/* --- ESTILO DE LOS MENSAJES DE ESTADO --- */
#sin-resultados, #instruccion-busqueda {
    color: #ccc; /* Gris clarito */
    font-style: italic;
    font-family: 'Times New Roman', serif;
    margin-top: 20px;
}
</style>
</head>

<body>

<div id="inicio" onclick="entrar()">
    <div>
        <strong>NOCTARIO</strong><br>
        archivo público de sueños<br><br>
        <div id="click-entrar">click para entrar</div>
    </div>
</div>

<div id="top-nav" onclick="toggleVista()">&#8942;</div>

<div id="escritura">
    <textarea id="input-sueño" placeholder="escribí acá tu sueño..."></textarea>
    <button onclick="enviar()">enviar</button>
</div>

<div id="biblioteca">
    <div id="centro-biblioteca">
        <input type="text" id="buscador" placeholder="buscar palabra..." onkeyup="filtrar()">
        <div id="contenedor-sueños">
            <p id="instruccion-busqueda">el archivo está cerrado. busca una palabra para abrirlo...</p>
        </div>
    </div>
</div>

<div id="contador">SUEÑOS REGISTRADOS: <span id="numero-visitas">000000000</span></div>

<script>
const csvURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ9mxN12Z9oWisGoaJIlpRM4BxJDC_NrkEvKykC6axWlm0yffKoC7N5WDc4DUN8BLgm0lEqyMpD2zvz/pub?gid=160434688&single=true&output=csv";
const formURL = "https://docs.google.com/forms/d/e/1FAIpQLSee-5mK3MjGQlEShw2ywKG_0pDg89ZzxaujpOdNGgm_7tzl0Q/formResponse";
const entryID = "entry.1116877069";

function entrar() {
    actualizarContadorReal(); 
    const inicio = document.getElementById('inicio');
    inicio.style.opacity = '0';
    setTimeout(() => {
        inicio.style.display = 'none';
    }, 1000);
}

function toggleVista() {
    const esc = document.getElementById('escritura');
    const bib = document.getElementById('biblioteca');
    const nav = document.getElementById('top-nav');

    if (bib.style.display === 'none' || bib.style.display === '') {
        bib.style.display = 'block';
        esc.style.display = 'none';
        nav.innerText = '←';
        cargarSueños();
    } else {
        bib.style.display = 'none';
        esc.style.display = 'flex';
        nav.innerHTML = '&#8942;';
        document.getElementById('buscador').value = "";
    }
}

async function actualizarContadorReal() {
    const display = document.getElementById('numero-visitas');
    try {
        const respuesta = await fetch(csvURL + "&cache=" + new Date().getTime());
        const data = await respuesta.text();
        const filas = data.split(/\r?\n/).filter(line => line.trim().length > 2);
        let total = filas.length - 1; 
        if (total < 0) total = 0;
        display.innerText = total.toString().padStart(9, '0');
    } catch (error) {
        console.error("Error contador:", error);
    }
}

async function cargarSueños() {
    const contenedor = document.getElementById('contenedor-sueños');
    try {
        const respuesta = await fetch(csvURL + "&cache=" + new Date().getTime());
        const data = await respuesta.text();
        const filas = data.split(/\r?\n/).filter(line => line.trim().length > 2).slice(1);
        
        contenedor.innerHTML = '<p id="instruccion-busqueda">el archivo está cerrado. busca una palabra para abrirlo...</p>';
        
        filas.reverse().forEach(fila => {
            const columnas = fila.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            let sueñoLimpio = columnas[1]?.replace(/^"|"$/g, "").replace(/""/g, '"');
            
            if (sueñoLimpio && sueñoLimpio.trim() !== "") {
                const div = document.createElement('div');
                div.className = 'sueño';
                div.innerText = sueñoLimpio;
                contenedor.appendChild(div);
            }
        });
    } catch (error) {
        contenedor.innerHTML = "<p>no se pudo abrir el archivo.</p>";
    }
}

function filtrar() {
    let input = document.getElementById('buscador').value.toLowerCase().trim();
    let sueños = document.getElementsByClassName('sueño');
    let instruccion = document.getElementById('instruccion-busqueda');
    let encontrados = 0;

    let previo = document.getElementById('sin-resultados');
    if (previo) previo.remove();

    if (input === "") {
        if (instruccion) instruccion.style.display = "block";
        for (let s of sueños) s.style.display = "none";
        return;
    }

    if (instruccion) instruccion.style.display = "none";

    for (let s of sueños) {
        if (s.innerText.toLowerCase().includes(input)) {
            s.style.display = "block";
            encontrados++;
        } else {
            s.style.display = "none";
        }
    }

    if (encontrados === 0) {
        const p = document.createElement('p');
        p.id = 'sin-resultados';
        p.innerText = 'no hay registro aún';
        document.getElementById('contenedor-sueños').appendChild(p);
    }
}

function enviar() {
    const texto = document.getElementById('input-sueño').value;
    if (!texto.trim()) return;

    let iframe = document.createElement('iframe');
    iframe.name = 'hidden_iframe';
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.action = formURL;
    form.method = 'POST';
    form.target = 'hidden_iframe';

    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = entryID;
    input.value = texto;
    form.appendChild(input);

    document.body.appendChild(form);
    form.submit();

    alert("el sueño ha sido entregado.");
    document.getElementById('input-sueño').value = "";
    
    setTimeout(() => {
        if (form.parentNode) document.body.removeChild(form);
        if (iframe.parentNode) document.body.removeChild(iframe);
        actualizarContadorReal();
    }, 2000);
}
</script>

</body>
</html>
