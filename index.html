<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noctario — Archivo de sueños</title>

<style>
body {
    background: white;
    color: black;
    font-family: "Courier New", monospace;
    margin: 0;
    height: 100vh;
    overflow: hidden;
}

/* PANTALLA DE INICIO */

#inicio {
    display: flex;
    height: 100vh;
    align-items: center;
    justify-content: center;
    text-align: center;
    cursor: pointer;
    line-height: 1.6;
}

/* APP ORIGINAL */

#app {
    display: none;
}

#top-nav {
    position: absolute;
    top: 25px;
    right: 25px;
    font-size: 26px;
    cursor: pointer;
    user-select: none;
}

#escritura {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
}

textarea {
    width: 80%;
    max-width: 520px;
    height: 140px;
    border: 1px solid black;
    padding: 15px;
    font-family: "Courier New", monospace;
    font-size: 16px;
    resize: none;
    outline: none;
    background: white;
}

button {
    background: white;
    border: 1px solid black;
    padding: 8px 22px;
    margin-top: 18px;
    font-family: "Courier New", monospace;
    cursor: pointer;
}

button:hover {
    background: black;
    color: white;
}

#biblioteca {
    display: none;
    height: 100%;
    overflow-y: auto;
    padding: 90px 20px;
}

#centro {
    max-width: 600px;
    margin: auto;
}

#buscador {
    width: 100%;
    border: none;
    border-bottom: 1px solid black;
    font-size: 22px;
    margin-bottom: 40px;
    outline: none;
}

.sueno {
    margin-bottom: 35px;
    border-bottom: 1px dotted #ccc;
    padding-bottom: 18px;
    white-space: pre-wrap;
    font-family: "Times New Roman", serif;
    font-size: 18px;
}

#contador {
    position: fixed;
    bottom: 12px;
    left: 12px;
    font-size: 10px;
    color: #888;
}
</style>
</head>

<body>

<!-- ✧ INICIO ✧ -->

<div id="inicio" onclick="entrar()">
    <div>
        NOCTARIO<br>
        archivo público de sueños<br><br>
        click para entrar
    </div>
</div>

<!-- ✧ APP ORIGINAL ✧ -->

<div id="app">

<div id="top-nav" onclick="toggleVista()">&#8942;</div>

<div id="escritura">
    <textarea id="sueno" placeholder="escribí acá tu sueño..."></textarea>
    <button onclick="enviar()">enviar</button>
</div>

<div id="biblioteca">
    <div id="centro">
        <input id="buscador" placeholder="buscar palabra..." onkeyup="filtrar()">
        <div id="contenedor">abriendo archivo...</div>
    </div>
</div>

<div id="contador">VISITAS: 000000001</div>

</div>

<script>

// ====== CONFIGURACIÓN ======

const formURL =
"https://docs.google.com/forms/d/e/1FAIpQLSee-5mK3MjGQlEShw2ywKG_0pDg89ZzxaujpOdNGgm_7tzl0Q/formResponse";

const entryID = "entry.550106680";

const csvURL =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vR9mxN12Z9oWisGoaJIlpRM4BxJDC_NrkEvKykC6axWlm0yffKoC7N5WDc4DUN8BLgm0lEqyMpD2zvz/pub?gid=160434688&single=true&output=csv";


// ====== ENTRAR ======

function entrar() {
    document.getElementById("inicio").style.display = "none";
    document.getElementById("app").style.display = "block";
}


// ====== CAMBIO DE VISTA ======

function toggleVista() {

    const esc = document.getElementById("escritura");
    const bib = document.getElementById("biblioteca");
    const nav = document.getElementById("top-nav");

    if (bib.style.display === "none" || bib.style.display === "") {
        bib.style.display = "block";
        esc.style.display = "none";
        nav.innerText = "←";
        cargar();
    } else {
        bib.style.display = "none";
        esc.style.display = "flex";
        nav.innerHTML = "&#8942;";
    }
}


// ====== ENVIAR SUEÑO ======

function enviar() {

    const texto = document.getElementById("sueno").value.trim();

    if (!texto) return;

    const iframe = document.createElement("iframe");
    iframe.name = "hidden_iframe";
    iframe.style.display = "none";
    document.body.appendChild(iframe);

    const form = document.createElement("form");
    form.action = formURL;
    form.method = "POST";
    form.target = "hidden_iframe";

    const input = document.createElement("textarea");
    input.name = entryID;
    input.value = texto;
    form.appendChild(input);

    document.body.appendChild(form);

    form.submit();

    alert("sueño enviado ✧");

    document.getElementById("sueno").value = "";

    setTimeout(() => {
        document.body.removeChild(form);
        document.body.removeChild(iframe);
    }, 1000);
}


// ====== CARGAR ARCHIVO ======

async function cargar() {

    const cont = document.getElementById("contenedor");

    try {

        const r = await fetch(csvURL + "&t=" + Date.now());
        const txt = await r.text();

        const filas = txt.split("\n").slice(1);

        cont.innerHTML = "";

        filas.reverse().forEach(f => {

            const col = f.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
            const texto = col[1]?.replace(/^"|"$/g, "").replace(/""/g, '"');

            if (texto && texto.trim()) {

                const div = document.createElement("div");
                div.className = "sueno";
                div.textContent = texto;

                cont.appendChild(div);
            }
        });

    } catch {
        cont.textContent = "no se pudo cargar";
    }
}


// ====== BUSCADOR ======

function filtrar() {

    const palabra =
    document.getElementById("buscador").value.toLowerCase();

    const suenos =
    document.getElementsByClassName("sueno");

    for (let s of suenos) {

        s.style.display =
        s.textContent.toLowerCase().includes(palabra)
        ? "block"
        : "none";
    }
}

</script>

</body>
</html>
