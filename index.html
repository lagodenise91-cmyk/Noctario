<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Noctario — Archivo de sueños</title>

<style>
body {
    margin: 0;
    background: #000;
    color: #fff;
    font-family: monospace;
}

#inicio {
    display: flex;
    height: 100vh;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-align: center;
}

#app {
    display: none;
    padding: 40px;
}

textarea {
    width: 100%;
    height: 220px;
    background: #000;
    color: #fff;
    border: 1px solid #fff;
    padding: 10px;
    font-family: monospace;
}

button {
    background: #fff;
    color: #000;
    border: none;
    padding: 8px 18px;
    margin-top: 10px;
    cursor: pointer;
}

input {
    background: #000;
    color: #fff;
    border: 1px solid #fff;
    padding: 6px;
}

#resultados {
    margin-top: 40px;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<div id="inicio" onclick="entrar()">
    <div>
        NOCTARIO<br>
        archivo público de sueños<br><br>
        click para entrar
    </div>
</div>

<div id="app">

<textarea id="sueno" placeholder="escribí tu sueño..."></textarea><br>
<button onclick="enviar()">enviar</button>

<div style="margin-top:30px;">
    buscar palabra:
    <input id="busqueda">
    <button onclick="filtrar()">buscar</button>
</div>

<div id="resultados"></div>

</div>

<script>

function entrar() {
    document.getElementById("inicio").style.display = "none";
    document.getElementById("app").style.display = "block";
}

function enviar() {

    const texto = document.getElementById("sueno").value.trim();

    if (!texto) {
        alert("escribí algo");
        return;
    }

    const url = "https://docs.google.com/forms/d/e/1FAIpQLSee-5mK3MjGQlEShw2ywKG_0pDg89ZzxaujpOdNGgm_7tzl0Q/formResponse";

    const form = document.createElement("form");
    form.method = "POST";
    form.action = url;
    form.target = "hidden_iframe";

    const input = document.createElement("textarea");
    input.name = "entry.1981831967";
    input.value = texto;

    form.appendChild(input);
    document.body.appendChild(form);

    const iframe = document.createElement("iframe");
    iframe.name = "hidden_iframe";
    iframe.style.display = "none";
    document.body.appendChild(iframe);

    form.submit();

    document.getElementById("sueno").value = "";
    alert("sueño enviado ✧");

    setTimeout(() => {
        document.body.removeChild(form);
        document.body.removeChild(iframe);
    }, 1000);
}

let base = [];

fetch("suenos.csv")
.then(r => r.text())
.then(texto => {
    base = texto.split("\n");
    mostrar(base);
});

function mostrar(lista) {
    const div = document.getElementById("resultados");
    div.innerHTML = "";

    lista.forEach(s => {
        if (s.trim() !== "") {
            const p = document.createElement("p");
            p.textContent = s;
            div.appendChild(p);
        }
    });
}

function filtrar() {
    const palabra = document.getElementById("busqueda").value.toLowerCase();
    const filtrados = base.filter(s => s.toLowerCase().includes(palabra));
    mostrar(filtrados);
}

</script>

</body>
</html>
